name: Build and Push FHIR IG Builder image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - fhir-packages.txt
      - .github/workflows/build-docker.yml
  workflow_dispatch:
  schedule:
    # Rebuild hebdomadaire lundi 06:00 UTC pour capter les nouvelles versions SUSHI
    - cron: '0 6 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine monthly tag
        id: monthly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_MONTH=$(date -u +'%Y-%m')
          EXISTING_TAGS=$(gh api /orgs/ansforge/packages/container/fhir-ig-builder/versions --paginate \
            --jq '.[].metadata.container.tags[]?' 2>/dev/null || true)
          TAGS="ghcr.io/ansforge/fhir-ig-builder:latest"
          if echo "$EXISTING_TAGS" | grep -qx "$CURRENT_MONTH"; then
            echo "Mois $CURRENT_MONTH déjà taggué, pas de tag mensuel pour ce build."
          else
            TAGS="${TAGS}"$'\n'"ghcr.io/ansforge/fhir-ig-builder:${CURRENT_MONTH}"
            echo "Premier build du mois $CURRENT_MONTH, ajout du tag mensuel."
          fi
          { echo "tags<<EOF"; echo "$TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Resolve versions
        id: versions
        run: |
          PUBLISHER_VERSION=$(curl -s https://api.github.com/repos/HL7/fhir-ig-publisher/releases/latest | jq -r '.tag_name')
          SUSHI_VERSION=$(curl -s https://registry.npmjs.org/fsh-sushi/latest | jq -r '.version')
          node scripts/generate-warmup-config.mjs fhir-packages.txt /tmp/warmup-sushi-config.yaml
          PACKAGES_LIST=$(awk '/^dependencies:/{flag=1;next}/^[^ ]/{flag=0}flag' /tmp/warmup-sushi-config.yaml \
            | sed 's/^ *//;s/: /@/' | paste -sd ',' -)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "publisher=${PUBLISHER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sushi=${SUSHI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "packages=${PACKAGES_LIST}" >> "$GITHUB_OUTPUT"
          echo "date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.monthly.outputs.tags }}
          build-args: |
            PUBLISHER_VERSION=${{ steps.versions.outputs.publisher }}
            SUSHI_VERSION=${{ steps.versions.outputs.sushi }}
            PACKAGES_LIST=${{ steps.versions.outputs.packages }}
            BUILD_DATE=${{ steps.versions.outputs.date }}
          labels: |
            org.opencontainers.image.description=Image Docker pour la publication de guides d'implémentation FHIR ANS (SUSHI + IG Publisher + Jekyll). IG Publisher ${{ steps.versions.outputs.publisher }}, SUSHI ${{ steps.versions.outputs.sushi }}. Packages FHIR préchargés : ${{ steps.versions.outputs.packages }}.
            org.opencontainers.image.created=${{ steps.versions.outputs.date }}
          annotations: |
            index,manifest:org.opencontainers.image.description=Image Docker pour la publication de guides d'implémentation FHIR ANS (SUSHI + IG Publisher + Jekyll). IG Publisher ${{ steps.versions.outputs.publisher }}, SUSHI ${{ steps.versions.outputs.sushi }}. Packages FHIR préchargés : ${{ steps.versions.outputs.packages }}.
            index,manifest:org.opencontainers.image.created=${{ steps.versions.outputs.date }}

      - name: Verify image
        run: |
          docker run --rm ghcr.io/ansforge/fhir-ig-builder:latest sushi --version
          docker run --rm ghcr.io/ansforge/fhir-ig-builder:latest java -version
          docker run --rm ghcr.io/ansforge/fhir-ig-builder:latest jekyll --version
          docker run --rm ghcr.io/ansforge/fhir-ig-builder:latest dot -V
          docker run --rm ghcr.io/ansforge/fhir-ig-builder:latest python3 --version
          echo "IG Publisher version baked into image:"
          docker run --rm ghcr.io/ansforge/fhir-ig-builder:latest cat /root/publisher-version.txt

      - name: Clean up old image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_DIGEST="${{ steps.build.outputs.digest }}"
          gh api /orgs/ansforge/packages/container/fhir-ig-builder/versions --paginate \
            --jq '.[] | [.id, .name, (.metadata.container.tags // [] | join(","))] | @tsv' \
          | while IFS=$'\t' read -r id name tags; do
              [ "$name" = "$CURRENT_DIGEST" ] && continue
              if echo "$tags" | tr ',' '\n' | grep -Eq '^[0-9]{4}-[0-9]{2}$'; then
                continue
              fi
              echo "Suppression version $id (digest $name, tags: ${tags:-<aucun>})"
              gh api -X DELETE "/orgs/ansforge/packages/container/fhir-ig-builder/versions/$id" \
                || echo "::warning::Échec de suppression de la version $id"
            done
